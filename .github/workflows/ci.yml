name: ci.yml

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  build-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - run: chmod +x ./gradlew

      - name: Build and test
        run: ./gradlew clean check --no-daemon

      - name: Sonar analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: ./gradlew sonar --no-daemon

      - name: Quality Gate
        if: github.ref == 'refs/heads/main'
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        with:
          scanMetadataReportFile: build/sonar/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  dependency-scan:
    runs-on: ubuntu-latest
    needs: build-and-analyze

    steps:
      - name: Debug NVD API KEY presence
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "NVD_API_KEY is EMPTY"
            exit 1
          else
            echo "NVD_API_KEY is SET"
          fi
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Test NVD API manually
        run: |
          curl -H "apiKey: $NVD_API_KEY" https://services.nvd.nist.gov/rest/json/cves/2.0?resultsPerPage=1
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: chmod +x ./gradlew

      - name: OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAnalyze --no-daemon

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: build/reports/dependency-check-report.html